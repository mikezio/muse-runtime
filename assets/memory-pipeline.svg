<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arr3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="860" height="400" fill="#ffffff"/>
  <text x="430" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#24292f">the memory pipeline</text>

  <!-- stage 1 -->
  <rect x="40" y="70" width="230" height="230" rx="12" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <text x="155" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#24292f">1 · capture</text>
  <text x="155" y="122" text-anchor="middle" font-size="12" fill="#57606a">during the session</text>
  <text x="60" y="150" font-size="12" fill="#24292f">writes durable facts to</text>
  <text x="60" y="168" font-size="12" fill="#24292f">MEMORY.md - before replying,</text>
  <text x="60" y="186" font-size="12" fill="#24292f">not after</text>
  <text x="60" y="214" font-size="12" fill="#24292f">only what a tool result</text>
  <text x="60" y="232" font-size="12" fill="#24292f">confirmed; reconcile on</text>
  <text x="60" y="250" font-size="12" fill="#24292f">change; never store secrets</text>

  <!-- stage 2 -->
  <rect x="315" y="70" width="230" height="230" rx="12" fill="#fff8c5" stroke="#9a6700" stroke-width="2"/>
  <text x="430" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#24292f">2 · consolidate</text>
  <text x="430" y="122" text-anchor="middle" font-size="12" fill="#57606a">nightly background jobs</text>
  <text x="335" y="150" font-size="12" fill="#24292f">daily logs → dated notes</text>
  <text x="335" y="168" font-size="12" fill="#24292f">dreams → journal synthesis</text>
  <text x="335" y="186" font-size="12" fill="#24292f">people/ + groups/ → one</text>
  <text x="335" y="204" font-size="12" fill="#24292f">page per person, indexed</text>
  <text x="335" y="232" font-size="12" fill="#24292f">alignment → how the agent</text>
  <text x="335" y="250" font-size="12" fill="#24292f">and user relate, derived</text>

  <!-- stage 3 -->
  <rect x="590" y="70" width="230" height="230" rx="12" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/>
  <text x="705" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#24292f">3 · derive</text>
  <text x="705" y="122" text-anchor="middle" font-size="12" fill="#57606a">turning notes into behavior</text>
  <text x="610" y="150" font-size="12" fill="#24292f">personalization notes →</text>
  <text x="610" y="168" font-size="12" fill="#24292f">distilled habits</text>
  <text x="610" y="196" font-size="12" fill="#24292f">alignment synthesis →</text>
  <text x="610" y="214" font-size="12" fill="#24292f">tone + posture calibration</text>
  <text x="610" y="242" font-size="12" fill="#24292f">ideas + feed → proactive</text>
  <text x="610" y="260" font-size="12" fill="#24292f">suggestions, deduped</text>

  <line x1="270" y1="185" x2="311" y2="185" stroke="#57606a" stroke-width="2" marker-end="url(#arr3)"/>
  <line x1="545" y1="185" x2="586" y2="185" stroke="#57606a" stroke-width="2" marker-end="url(#arr3)"/>

  <text x="430" y="340" text-anchor="middle" font-size="12" fill="#57606a">before answering about history, the agent searches memory - it never trusts vibes</text>
  <text x="430" y="362" text-anchor="middle" font-size="12" fill="#57606a">corrections are first-class: old claims are marked superseded, provenance is explainable</text>
</svg>
