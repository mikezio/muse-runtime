<svg xmlns="http://www.w3.org/2000/svg" width="860" height="460" viewBox="0 0 860 460" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="860" height="460" fill="#ffffff"/>
  <text x="430" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#24292f">the scheduler loop</text>

  <!-- cycle boxes -->
  <rect x="40" y="70" width="160" height="70" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <text x="120" y="97" text-anchor="middle" font-size="13" font-weight="600" fill="#24292f">cron fires</text>
  <text x="120" y="116" text-anchor="middle" font-size="11" fill="#57606a">clock · event · runonce</text>

  <rect x="250" y="70" width="160" height="70" rx="10" fill="#fff8c5" stroke="#9a6700" stroke-width="2"/>
  <text x="330" y="97" text-anchor="middle" font-size="13" font-weight="600" fill="#24292f">worker wakes</text>
  <text x="330" y="116" text-anchor="middle" font-size="11" fill="#57606a">reads files = remembers</text>

  <rect x="460" y="70" width="160" height="70" rx="10" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="540" y="97" text-anchor="middle" font-size="13" font-weight="600" fill="#24292f">does the work</text>
  <text x="540" y="116" text-anchor="middle" font-size="11" fill="#57606a">tools · skills · browser</text>

  <rect x="670" y="70" width="150" height="70" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/>
  <text x="745" y="97" text-anchor="middle" font-size="13" font-weight="600" fill="#24292f">writes + reports</text>
  <text x="745" y="116" text-anchor="middle" font-size="11" fill="#57606a">then sleeps</text>

  <line x1="200" y1="105" x2="246" y2="105" stroke="#57606a" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="410" y1="105" x2="456" y2="105" stroke="#57606a" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="620" y1="105" x2="666" y2="105" stroke="#57606a" stroke-width="2" marker-end="url(#arr2)"/>
  <!-- wrap arrow back -->
  <path d="M745,140 C745,190 120,190 120,140" fill="none" stroke="#57606a" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arr2)"/>

  <!-- heartbeat box -->
  <rect x="40" y="220" width="780" height="200" rx="12" fill="#f6f8fa" stroke="#0969da" stroke-width="1.5"/>
  <text x="430" y="248" text-anchor="middle" font-size="14" font-weight="700" fill="#24292f">the heartbeat - every ~30 minutes</text>
  <text x="70" y="278" font-size="12" fill="#24292f">1. read the user's proactive preferences <tspan fill="#57606a">(standing prefs never override a live instruction)</tspan></text>
  <text x="70" y="302" font-size="12" fill="#24292f">2. check recent cron runs for failures → <tspan fill="#57606a">diagnose, fix, or file a repair proposal with evidence</tspan></text>
  <text x="70" y="326" font-size="12" fill="#24292f">3. look one hour ahead → <tspan fill="#57606a">prep anything time-sensitive now</tspan></text>
  <text x="70" y="350" font-size="12" fill="#24292f">4. session health → <tspan fill="#57606a">surface only what needs the user (login code, approval, decision)</tspan></text>
  <text x="70" y="374" font-size="12" fill="#24292f">5. work the improvement queue → <tspan fill="#57606a">one real fix, verified, recorded</tspan></text>
  <text x="70" y="398" font-size="12" fill="#24292f">6. end with a report → <tspan fill="#57606a">checked / no_findings / skipped / blocked - a quiet tick is a fine tick</tspan></text>
</svg>
