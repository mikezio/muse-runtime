<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">From trigger to delivery</title><desc id="desc">Schedules, events and queued work each feed eligibility and dispatch. A dispatched worker produces a run outcome. The runtime records it, then follows the configured delivery path. Waiting and interruptions require status checks rather than assumed success.</desc>
<metadata>Conceptual flow based on native scheduling/task guidance; see docs/11-scheduler.md.</metadata>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#222"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#222;font-size:18px}.title{font-size:26px;font-weight:400}.group{font-size:19px;font-weight:700}.small{font-size:16px;fill:#555}.mono{font-family:Consolas,'Liberation Mono',monospace;font-size:16px}.head{font-size:18px;font-weight:700}</style>
<rect width="960" height="600" fill="white"/>
<text x="30" y="42" class="title" text-anchor="start">From trigger to delivery</text>
<path d="M30 64H930" fill="none" stroke="#bbb" stroke-width="1.3"/>
<rect x="55" y="121" width="230" height="54" fill="white" stroke="#333" stroke-width="1.3"/>
<text x="170.0" y="154.0" class="" text-anchor="middle">Schedule due</text>
<rect x="365" y="121" width="230" height="54" fill="white" stroke="#333" stroke-width="1.3"/>
<text x="480.0" y="154.0" class="" text-anchor="middle">Event</text>
<rect x="675" y="121" width="230" height="54" fill="white" stroke="#333" stroke-width="1.3"/>
<text x="790.0" y="154.0" class="" text-anchor="middle">Queued work</text>
<path d="M170 175L170 220" fill="none" stroke="#333" stroke-width="1.3"/>
<path d="M480 175L480 220" fill="none" stroke="#333" stroke-width="1.3"/>
<path d="M790 175L790 220" fill="none" stroke="#333" stroke-width="1.3"/>
<path d="M170 220H790" fill="none" stroke="#333" stroke-width="1.3"/>
<path d="M480 220L480 262" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="355" y="262" width="250" height="58" fill="white" stroke="#333" stroke-width="1.3"/>
<text x="480.0" y="297.0" class="" text-anchor="middle">Eligibility / dispatch</text>
<rect x="355" y="369" width="250" height="58" fill="white" stroke="#333" stroke-width="1.3"/>
<text x="480.0" y="404.0" class="" text-anchor="middle">Worker run</text>
<path d="M480 320L480 369" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="35" y="369" width="245" height="58" fill="white" stroke="#333" stroke-width="1.3"/>
<text x="157.5" y="404.0" class="" text-anchor="middle">Waiting / interrupted</text>
<path d="M355 398H280" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
<text x="37" y="463" class="small" text-anchor="start">Inspect current state.</text>
<text x="37" y="487" class="small" text-anchor="start">Resume or retry only as appropriate.</text>
<rect x="685" y="369" width="245" height="58" fill="white" stroke="#333" stroke-width="1.3"/>
<text x="807.5" y="404.0" class="" text-anchor="middle">Record run outcome</text>
<path d="M605 398H685" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
<text x="617" y="383" class="small" text-anchor="start">ends</text>
<rect x="685" y="478" width="245" height="58" fill="white" stroke="#333" stroke-width="1.3"/>
<text x="807.5" y="513.0" class="" text-anchor="middle">Configured delivery</text>
<path d="M807 427L807 478" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
<text x="823" y="458" class="small" text-anchor="start">if applicable</text>
<text x="30" y="577" class="small" text-anchor="start">A job being defined, dispatched, completed and delivered are four different facts. No fixed cadence is implied.</text>
</svg>
