<svg xmlns="http://www.w3.org/2000/svg" width="960" height="550" viewBox="0 0 960 550" role="img" aria-labelledby="title desc">
<title id="title">Agent ownership</title><desc id="desc">A conversation root may delegate general children and own browser tasks. Further child delegation depends on policy. Scheduled, event-driven or queued work can activate a separate background worker with its own delivery path.</desc>
<metadata>Observed roles and native tool contracts, September 2026; see docs/15-agents.md.</metadata>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#222"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#222;font-size:18px}.title{font-size:26px;font-weight:400}.group{font-size:19px;font-weight:700}.small{font-size:16px;fill:#555}.mono{font-family:Consolas,'Liberation Mono',monospace;font-size:16px}.head{font-size:18px;font-weight:700}</style>
<rect width="960" height="550" fill="white"/>
<text x="30" y="42" class="title" text-anchor="start">Agent ownership</text>
<path d="M30 64H930" fill="none" stroke="#bbb" stroke-width="1.3"/>
<text x="30" y="106" class="group" text-anchor="start">Conversation work</text>
<text x="690" y="106" class="group" text-anchor="start">Background work</text>
<path d="M650 95L650 482" fill="none" stroke="#bbb" stroke-width="1.3"/>
<rect x="175" y="140" width="280" height="60" fill="white" stroke="#333" stroke-width="1.3"/>
<text x="315.0" y="176.0" class="" text-anchor="middle">Conversation root</text>
<rect x="30" y="282" width="245" height="65" fill="white" stroke="#333" stroke-width="1.3"/>
<text x="152.5" y="320.5" class="" text-anchor="middle">General subagent</text>
<rect x="365" y="282" width="245" height="65" fill="white" stroke="#333" stroke-width="1.3"/>
<text x="487.5" y="320.5" class="" text-anchor="middle">Browser task agent</text>
<path d="M260 200V241H152V282" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
<text x="65" y="230" class="small" text-anchor="start">delegates</text>
<path d="M375 200V241H487V282" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
<text x="430" y="230" class="small" text-anchor="start">owns task</text>
<rect x="30" y="416" width="245" height="55" fill="white" stroke="#333" stroke-width="1.3"/>
<text x="152.5" y="449.5" class="" text-anchor="middle">Further child</text>
<path d="M152 347L152 416" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)" stroke-dasharray="5 4"/>
<text x="168" y="389" class="small" text-anchor="start">if allowed</text>
<text x="385" y="394" class="small" text-anchor="start">Self-contained brief;</text>
<text x="385" y="418" class="small" text-anchor="start">browser-specific tools.</text>
<rect x="690" y="140" width="240" height="70" fill="white" stroke="#333" stroke-width="1.3"/>
<text x="810.0" y="181.0" class="" text-anchor="middle">Schedule / event / queue</text>
<rect x="690" y="282" width="240" height="65" fill="white" stroke="#333" stroke-width="1.3"/>
<text x="810.0" y="320.5" class="" text-anchor="middle">Background worker</text>
<path d="M810 210L810 282" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
<text x="825" y="252" class="small" text-anchor="start">activates</text>
<rect x="690" y="416" width="240" height="55" fill="white" stroke="#333" stroke-width="1.3"/>
<text x="810.0" y="449.5" class="" text-anchor="middle">Configured delivery</text>
<path d="M810 347L810 416" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
<text x="825" y="389" class="small" text-anchor="start">reports</text>
<text x="30" y="527" class="small" text-anchor="start">Edges show ownership or activation, not shared context. Tools and model policy can differ by role.</text>
</svg>
