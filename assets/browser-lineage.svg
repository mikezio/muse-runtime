<svg xmlns="http://www.w3.org/2000/svg" width="960" height="590" viewBox="0 0 960 590" role="img" aria-labelledby="title desc">
<title id="title">Browser task lifecycle</title><desc id="desc">A submitted task is accepted, runs, and can complete or fail. A running task can wait for input or approval and resume under the same task. Session and authentication state belong to the browser service and are distinct from task state.</desc>
<metadata>Conceptual lifecycle from browser.spawn_task and browser.steer_task guidance; labels are not API state enums. See docs/06-browser.md.</metadata>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#222"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#222;font-size:18px}.title{font-size:26px;font-weight:400}.group{font-size:19px;font-weight:700}.small{font-size:16px;fill:#555}.mono{font-family:Consolas,'Liberation Mono',monospace;font-size:16px}.head{font-size:18px;font-weight:700}</style>
<rect width="960" height="590" fill="white"/>
<text x="30" y="42" class="title" text-anchor="start">Browser task lifecycle</text>
<path d="M30 64H930" fill="none" stroke="#bbb" stroke-width="1.3"/>
<rect x="30" y="122" width="165" height="52" fill="white" stroke="#333" stroke-width="1.3"/>
<text x="112.5" y="154.0" class="" text-anchor="middle">Submitted</text>
<rect x="265" y="122" width="165" height="52" fill="white" stroke="#333" stroke-width="1.3"/>
<text x="347.5" y="154.0" class="" text-anchor="middle">Accepted</text>
<rect x="510" y="122" width="180" height="52" fill="white" stroke="#333" stroke-width="1.3"/>
<text x="600.0" y="154.0" class="" text-anchor="middle">Running</text>
<rect x="750" y="122" width="180" height="52" fill="white" stroke="#333" stroke-width="1.3"/>
<text x="840.0" y="154.0" class="" text-anchor="middle">Completed</text>
<path d="M195 148H265" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
<path d="M430 148H510" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
<path d="M690 148H750" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="370" y="300" width="230" height="60" fill="white" stroke="#333" stroke-width="1.3"/>
<text x="485.0" y="336.0" class="" text-anchor="middle">Waiting for input</text>
<path d="M555 174V235H485V300" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
<text x="315" y="221" class="small" text-anchor="start">input / approval needed</text>
<path d="M600 330H655V174" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
<text x="640" y="266" class="small" text-anchor="end">steer / resume</text>
<text x="640" y="290" class="small" text-anchor="end">same task</text>
<rect x="740" y="300" width="190" height="60" fill="white" stroke="#333" stroke-width="1.3"/>
<text x="835.0" y="336.0" class="" text-anchor="middle">Failed</text>
<path d="M690 163H715V330H740" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
<text x="730" y="252" class="small" text-anchor="start">error</text>
<rect x="740" y="450" width="190" height="52" fill="white" stroke="#333" stroke-width="1.3"/>
<text x="835.0" y="482.0" class="" text-anchor="middle">Owner handoff</text>
<path d="M930 148H945V476H930" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
<path d="M835 360L835 450" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
<path d="M30 398H680" fill="none" stroke="#bbb" stroke-width="1.3"/>
<text x="30" y="436" class="group" text-anchor="start">Browser session ≠ browser task</text>
<text x="30" y="472" class="small" text-anchor="start">Profile and authentication state are managed by the browser service.</text>
<text x="30" y="498" class="small" text-anchor="start">A new task does not establish whether a login is present.</text>
<text x="30" y="524" class="small" text-anchor="start">After interruption, inspect task status and effects before retrying.</text>
<text x="30" y="567" class="small" text-anchor="start">Lifecycle is conceptual. Acceptance, completion and the owner receiving a result are separate events.</text>
</svg>
