<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arr4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="860" height="420" fill="#ffffff"/>
  <text x="430" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#24292f">browser sessions: spawn vs steer</text>

  <!-- spawn path -->
  <rect x="40" y="70" width="370" height="270" rx="12" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/>
  <text x="225" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#24292f">fresh spawn_task</text>
  <text x="70" y="135" font-size="12" fill="#24292f">new task, blank cookie jar</text>
  <text x="70" y="157" font-size="12" fill="#24292f">site sees: logged OUT</text>
  <text x="70" y="179" font-size="12" fill="#24292f">even if another task is signed in</text>
  <text x="70" y="201" font-size="12" fill="#24292f">right now</text>
  <text x="70" y="235" font-size="12" font-weight="600" fill="#cf222e">use for: brand-new work,</text>
  <text x="70" y="253" font-size="12" font-weight="600" fill="#cf222e">separate sites, recovery</text>
  <text x="70" y="287" font-size="12" fill="#57606a">proven by experiment: two tasks,</text>
  <text x="70" y="305" font-size="12" fill="#57606a">same site, seconds apart -</text>
  <text x="70" y="323" font-size="12" fill="#57606a">one in, one out</text>

  <!-- steer path -->
  <rect x="450" y="70" width="370" height="270" rx="12" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="635" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#24292f">steer_task on the lineage</text>
  <text x="480" y="135" font-size="12" fill="#24292f">same task id, session kept</text>
  <text x="480" y="157" font-size="12" fill="#24292f">site sees: still logged IN</text>
  <text x="480" y="179" font-size="12" fill="#24292f">even across days and jobs</text>
  <text x="480" y="201" font-size="12" fill="#24292f">closed task? steering builds a</text>
  <text x="480" y="219" font-size="12" fill="#24292f">successor from history - cookies</text>
  <text x="480" y="237" font-size="12" fill="#24292f">survive</text>
  <text x="480" y="271" font-size="12" font-weight="600" fill="#1a7f37">use for: all logged-in work,</text>
  <text x="480" y="289" font-size="12" font-weight="600" fill="#1a7f37">every recurring job</text>
  <text x="480" y="323" font-size="12" fill="#57606a">the lineage id is precious state:</text>
  <text x="480" y="341" font-size="12" fill="#57606a">lose it and you log in again</text>

  <text x="430" y="380" text-anchor="middle" font-size="12" fill="#57606a">one shared Chromium profile underneath it all - parallel tasks must not fight over it</text>
</svg>
