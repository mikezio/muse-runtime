<svg xmlns="http://www.w3.org/2000/svg" width="960" height="740" viewBox="0 0 960 740" role="img" aria-labelledby="title desc">
<title id="title">A tool-using conversation turn</title><desc id="desc">A client sends a message to the harness. The harness assembles context and calls inference. A tool request is executed and its result returns for further inference; this may repeat. The final reply goes to the client. Proxies and transport details are omitted.</desc>
<metadata>Logical sequence based on the runtime interfaces described in docs/02-the-agent-outside.md and docs/runtime-api.md.</metadata>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#222"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#222;font-size:18px}.title{font-size:26px;font-weight:400}.group{font-size:19px;font-weight:700}.small{font-size:16px;fill:#555}.mono{font-family:Consolas,'Liberation Mono',monospace;font-size:16px}.head{font-size:18px;font-weight:700}</style>
<rect width="960" height="740" fill="white"/>
<text x="30" y="42" class="title" text-anchor="start">A tool-using conversation turn</text>
<path d="M30 64H930" fill="none" stroke="#bbb" stroke-width="1.3"/>
<text x="90" y="107" class="head" text-anchor="middle">Client</text>
<path d="M90 128L90 675" fill="none" stroke="#999" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="340" y="107" class="head" text-anchor="middle">Harness</text>
<path d="M340 128L340 675" fill="none" stroke="#999" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="605" y="107" class="head" text-anchor="middle">Model inference</text>
<path d="M605 128L605 675" fill="none" stroke="#999" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="870" y="107" class="head" text-anchor="middle">Tool / service</text>
<path d="M870 128L870 675" fill="none" stroke="#999" stroke-width="1.3" stroke-dasharray="5 4"/>
<path d="M90 157H340" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
<text x="215.0" y="147" class="small" text-anchor="middle">message</text>
<rect x="285" y="176" width="110" height="49" fill="#fafafa" stroke="#333" stroke-width="1.3"/>
<text x="340" y="196" class="small" text-anchor="middle">assemble</text>
<text x="340" y="215" class="small" text-anchor="middle">context</text>
<path d="M340 251H605" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
<text x="472.5" y="241" class="small" text-anchor="middle">inference request</text>
<path d="M605 297H340" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)" stroke-dasharray="5 4"/>
<text x="472.5" y="287" class="small" text-anchor="middle">tool request or final text</text>
<rect x="245" y="320" width="680" height="242" fill="white" stroke="#333" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="258" y="345" class="small" text-anchor="start">If a tool is requested; repeat as needed</text>
<path d="M340 379H870" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
<text x="605.0" y="369" class="small" text-anchor="middle">route call · apply relevant authorization</text>
<path d="M870 425H340" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)" stroke-dasharray="5 4"/>
<text x="605.0" y="415" class="small" text-anchor="middle">tool result</text>
<path d="M340 472H605" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
<text x="472.5" y="462" class="small" text-anchor="middle">next inference, including result</text>
<path d="M605 522H340" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)" stroke-dasharray="5 4"/>
<text x="472.5" y="512" class="small" text-anchor="middle">another tool request or final text</text>
<path d="M340 612H90" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)" stroke-dasharray="5 4"/>
<text x="215.0" y="602" class="small" text-anchor="middle">final reply</text>
<text x="340" y="656" class="small" text-anchor="start">Asynchronous tools can return a receipt before a later handoff.</text>
<text x="30" y="717" class="small" text-anchor="start">Logical order only. Transport and proxies omitted; the tool loop is optional.</text>
</svg>
