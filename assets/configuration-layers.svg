<svg xmlns="http://www.w3.org/2000/svg" width="960" height="705" viewBox="0 0 960 705" role="img" aria-labelledby="title desc">
<title id="title">Configuration surfaces</title><desc id="desc">Independent settings surfaces for files, reasoning, model selection, client flags, server rollout, action permissions and launch environment. Each has its own scope and evidence; the rows do not imply precedence.</desc>
<metadata>Observed configuration interfaces and limits, September 26–27, 2026. See docs/configuration.md and docs/feature-flags.md.</metadata>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#222"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#222;font-size:18px}.title{font-size:26px;font-weight:400}.group{font-size:19px;font-weight:700}.small{font-size:16px;fill:#555}.mono{font-family:Consolas,'Liberation Mono',monospace;font-size:16px}.head{font-size:18px;font-weight:700}</style>
<rect width="960" height="705" fill="white"/>
<text x="30" y="42" class="title" text-anchor="start">Configuration surfaces</text>
<path d="M30 64H930" fill="none" stroke="#bbb" stroke-width="1.3"/>
<text x="30" y="112" class="head" text-anchor="start">Surface</text>
<text x="315" y="112" class="head" text-anchor="start">Scope</text>
<text x="615" y="112" class="head" text-anchor="start">What can be verified</text>
<path d="M30 130H930" fill="none" stroke="#333" stroke-width="1.3"/>
<text x="30" y="162" class="" text-anchor="start">Standing files</text>
<text x="315" y="162" class="small" text-anchor="start">Persona, notes, workflows</text>
<text x="615" y="162" class="small" text-anchor="start">Relevant file / consumer behavior</text>
<path d="M30 205H930" fill="none" stroke="#ccc" stroke-width="1.3"/>
<text x="30" y="234" class="" text-anchor="start">Reasoning preferences</text>
<text x="315" y="234" class="small" text-anchor="start">Root and subagent effort</text>
<text x="615" y="234" class="small" text-anchor="start">Config API readback; provider-effective</text>
<text x="615" y="255" class="small" text-anchor="start">effort was not exposed</text>
<path d="M30 277H930" fill="none" stroke="#ccc" stroke-width="1.3"/>
<text x="30" y="306" class="" text-anchor="start">Model selection</text>
<text x="315" y="306" class="small" text-anchor="start">Global in the tested runtime</text>
<text x="615" y="306" class="small" text-anchor="start">Selected route and diagnostic result;</text>
<text x="615" y="327" class="small" text-anchor="start">switches cleared working context</text>
<path d="M30 349H930" fill="none" stroke="#ccc" stroke-width="1.3"/>
<text x="30" y="378" class="" text-anchor="start">Client feature flags</text>
<text x="315" y="378" class="small" text-anchor="start">Web UI presentation / rollout</text>
<text x="615" y="378" class="small" text-anchor="start">Client values, not all backend gates</text>
<path d="M30 421H930" fill="none" stroke="#ccc" stroke-width="1.3"/>
<text x="30" y="450" class="" text-anchor="start">Server rollout / entitlement</text>
<text x="315" y="450" class="small" text-anchor="start">Backend feature availability</text>
<text x="615" y="450" class="small" text-anchor="start">Supported capability or action result</text>
<path d="M30 493H930" fill="none" stroke="#ccc" stroke-width="1.3"/>
<text x="30" y="522" class="" text-anchor="start">Action permissions</text>
<text x="315" y="522" class="small" text-anchor="start">Allowed action and its scope</text>
<text x="615" y="522" class="small" text-anchor="start">Permission state / approval outcome</text>
<path d="M30 565H930" fill="none" stroke="#ccc" stroke-width="1.3"/>
<text x="30" y="594" class="" text-anchor="start">Launch environment</text>
<text x="315" y="594" class="small" text-anchor="start">Service startup configuration</text>
<text x="615" y="594" class="small" text-anchor="start">Protected effective state may be</text>
<text x="615" y="615" class="small" text-anchor="start">unavailable from the cell</text>
<path d="M30 637H930" fill="none" stroke="#ccc" stroke-width="1.3"/>
<text x="30" y="682" class="small" text-anchor="start">Rows are independent surfaces, not an order of precedence. Stored intent and effective behavior can differ.</text>
</svg>
