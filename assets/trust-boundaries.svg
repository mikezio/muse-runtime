<rect x="30" y="162" width="205" height="70" fill="white" stroke="#333" stroke-width="1.3"/>
<text x="132.5" y="189" class="head" text-anchor="middle">Cell process</text>
<text x="132.5" y="213" class="small" text-anchor="middle">outbound request</text>
<rect x="335" y="162" width="275" height="70" fill="white" stroke="#333" stroke-width="1.3"/>
<text x="472.5" y="189" class="head" text-anchor="middle">Egress proxy / Sentinel</text>
<text x="472.5" y="213" class="small" text-anchor="middle">evaluate action and scope</text>
<path d="M235 197H335" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="730" y="162" width="200" height="70" fill="white" stroke="#333" stroke-width="1.3"/>
<text x="830.0" y="189" class="head" text-anchor="middle">Muse client</text>
<text x="830.0" y="213" class="small" text-anchor="middle">user approval</text>
<path d="M610 181H730" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
<text x="670" y="166" class="small" text-anchor="middle">ask</text>
<path d="M730 213H610" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)" stroke-dasharray="5 4"/>
<text x="670" y="246" class="small" text-anchor="middle">decision</text>
<rect x="335" y="327" width="275" height="70" fill="white" stroke="#333" stroke-width="1.3"/>
<text x="472.5" y="354" class="head" text-anchor="middle">Authorized request</text>
<text x="472.5" y="378" class="small" text-anchor="middle">replace surrogates if needed</text>
<path d="M472 232L472 327" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
<text x="488" y="286" class="small" text-anchor="start">allow</text>
<rect x="30" y="327" width="205" height="70" fill="white" stroke="#333" stroke-width="1.3"/>
<text x="132.5" y="368.0" class="" text-anchor="middle">Blocked / error</text>
<path d="M335 217H306V362H235" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
<text x="263" y="296" class="small" text-anchor="start">deny</text>
<rect x="730" y="327" width="200" height="70" fill="white" stroke="#333" stroke-width="1.3"/>
<text x="830.0" y="354" class="head" text-anchor="middle">authd</text>
<text x="830.0" y="378" class="small" text-anchor="middle">credential service</text>
<path d="M610 350H730" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
<path d="M730 378H610" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)" stroke-dasharray="5 4"/>
<text x="666" y="427" class="small" text-anchor="middle">credential lookup / return</text>
<text x="666" y="449" class="small" text-anchor="middle">when required</text>
<rect x="335" y="512" width="275" height="66" fill="white" stroke="#333" stroke-width="1.3"/>
