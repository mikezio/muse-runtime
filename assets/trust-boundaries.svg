<svg xmlns="http://www.w3.org/2000/svg" width="960" height="725" viewBox="0 0 960 725" role="img" aria-labelledby="title desc">
<title id="title">Example: authorizing an outbound request</title><desc id="desc">A cell process submits an outbound request to the egress proxy and Sentinel. The permission decision can allow, deny or ask the user through the client. An authorized credential-bearing request uses authd for credential insertion before reaching the service. Other tool paths differ.</desc>
<metadata>https://research.meta.ai/blog/security-and-safety-for-ai-agents-our-approach-with-muse; schematic of the published egress path, not every tool or service. See docs/03-sentinel.md.</metadata>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#222"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#222;font-size:18px}.title{font-size:26px;font-weight:400}.group{font-size:19px;font-weight:700}.small{font-size:16px;fill:#555}.mono{font-family:Consolas,'Liberation Mono',monospace;font-size:16px}.head{font-size:18px;font-weight:700}</style>
<rect width="960" height="725" fill="white"/>
<text x="30" y="42" class="title" text-anchor="start">Example: authorizing an outbound request</text>
<path d="M30 64H930" fill="none" stroke="#bbb" stroke-width="1.3"/>
<text x="30" y="112" class="group" text-anchor="start">Request</text>
