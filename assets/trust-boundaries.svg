<text x="30" y="610" class="small" text-anchor="start">Response path omitted. This is an authorization flow, not a deployment diagram.</text>
<text x="30" y="657" class="small" text-anchor="start">Cell UID 0 does not grant host authority. Authorized actions can still have consequences.</text>
<text x="30" y="683" class="small" text-anchor="start">This example does not describe the distinct browser, privileged-worker or device paths.</text>
