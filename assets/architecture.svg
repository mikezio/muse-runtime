<svg xmlns="http://www.w3.org/2000/svg" width="960" height="740" viewBox="0 0 960 740" role="img" aria-labelledby="title desc">
<title id="title">Muse deployment</title><desc id="desc">The personal VM contains a runtime cell and protected services outside that cell. The Hatch harness communicates with remote inference through a proxy. Clients connect to the harness. The diagram shows placement and selected interfaces, not every service connection.</desc>
<metadata>https://research.meta.ai/blog/security-and-safety-for-ai-agents-our-approach-with-muse; published launch design, checked 2026-09-28. See docs/diagrams.md.</metadata>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#222"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#222;font-size:18px}.title{font-size:26px;font-weight:400}.group{font-size:19px;font-weight:700}.small{font-size:16px;fill:#555}.mono{font-family:Consolas,'Liberation Mono',monospace;font-size:16px}.head{font-size:18px;font-weight:700}</style>
<rect width="960" height="740" fill="white"/>
<text x="30" y="42" class="title" text-anchor="start">Muse deployment</text>
<path d="M30 64H930" fill="none" stroke="#bbb" stroke-width="1.3"/>
<text x="30" y="105" class="group" text-anchor="start">Outside the personal VM</text>
<rect x="295" y="90" width="635" height="595" fill="white" stroke="#333" stroke-width="1.6"/>
<text x="315" y="120" class="group" text-anchor="start">Personal cloud VM</text>
<rect x="315" y="145" width="595" height="225" fill="white" stroke="#333" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="335" y="176" class="group" text-anchor="start">Runtime cell · systemd-nspawn</text>
<rect x="335" y="205" width="250" height="58" fill="white" stroke="#333" stroke-width="1.3"/>
<text x="460.0" y="240.0" class="" text-anchor="middle">hatch — agent harness</text>
<rect x="335" y="302" width="250" height="44" fill="white" stroke="#333" stroke-width="1.3"/>
<text x="460.0" y="330.0" class="" text-anchor="middle">Shell and local CLIs</text>
<path d="M460 263L460 302" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
<text x="471" y="286" class="small" text-anchor="start">executes</text>
<text x="640" y="229" class="mono" text-anchor="start">/home/hatch</text>
<text x="640" y="253" class="mono" text-anchor="start">workspace and files</text>
<text x="640" y="305" class="mono" text-anchor="start">/opt/hatch</text>
<text x="640" y="329" class="mono" text-anchor="start">shipped runtime</text>
<rect x="30" y="205" width="210" height="58" fill="white" stroke="#333" stroke-width="1.3"/>
<text x="135.0" y="240.0" class="" text-anchor="middle">Web / mobile client</text>
<path d="M240 234H335" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
<text x="260" y="223" class="small" text-anchor="start">chat</text>
<text x="335" y="414" class="group" text-anchor="start">Protected services</text>
<rect x="335" y="470" width="220" height="52" fill="white" stroke="#333" stroke-width="1.3"/>
<text x="445.0" y="502.0" class="" text-anchor="middle">Inference proxy</text>
<path d="M585 234H612V440H445V470" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="455" y="430" class="small" text-anchor="start">inference</text>
<rect x="30" y="470" width="210" height="52" fill="white" stroke="#333" stroke-width="1.3"/>
<text x="135.0" y="502.0" class="" text-anchor="middle">Remote model serving</text>
<path d="M335 496H240" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="272" y="482" class="small" text-anchor="middle">I/O</text>
<path d="M605 448L605 659" fill="none" stroke="#bbb" stroke-width="1.3"/>
<text x="635" y="468" class="small" text-anchor="start">Sentinel — action permissions</text>
<text x="635" y="501" class="small" text-anchor="start">hatch-safety — inference checks</text>
<text x="635" y="534" class="small" text-anchor="start">authd — credential service</text>
<text x="635" y="567" class="small" text-anchor="start">privsep — connector workers</text>
<text x="635" y="600" class="small" text-anchor="start">Browser broker</text>
<text x="635" y="633" class="small" text-anchor="start">Postgres — application state</text>
<text x="335" y="570" class="small" text-anchor="start">Telemetry proxy</text>
<text x="335" y="620" class="small" text-anchor="start">These services run outside the cell.</text>
<text x="30" y="717" class="small" text-anchor="start">Containment = deployment boundary. Arrows = selected interfaces. Published launch design; builds may differ.</text>
