<svg xmlns="http://www.w3.org/2000/svg" width="860" height="520" viewBox="0 0 860 520" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="860" height="520" fill="#ffffff"/>

  <!-- user -->
  <rect x="330" y="20" width="200" height="64" rx="12" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <text x="430" y="47" text-anchor="middle" font-size="15" font-weight="600" fill="#24292f">the user</text>
  <text x="430" y="66" text-anchor="middle" font-size="12" fill="#57606a">chat · voice · whatsapp</text>

  <!-- agent -->
  <rect x="300" y="124" width="260" height="72" rx="12" fill="#fff8c5" stroke="#9a6700" stroke-width="2"/>
  <text x="430" y="151" text-anchor="middle" font-size="15" font-weight="600" fill="#24292f">the agent</text>
  <text x="430" y="170" text-anchor="middle" font-size="12" fill="#57606a">model + tools + files</text>

  <!-- three pillars -->
  <rect x="60" y="236" width="220" height="96" rx="12" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="170" y="263" text-anchor="middle" font-size="14" font-weight="600" fill="#24292f">scheduler</text>
  <text x="170" y="283" text-anchor="middle" font-size="12" fill="#57606a">cron jobs</text>
  <text x="170" y="300" text-anchor="middle" font-size="12" fill="#57606a">heartbeat loop</text>
  <text x="170" y="317" text-anchor="middle" font-size="12" fill="#57606a">hooks</text>

  <rect x="320" y="236" width="220" height="96" rx="12" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="430" y="263" text-anchor="middle" font-size="14" font-weight="600" fill="#24292f">memory</text>
  <text x="430" y="283" text-anchor="middle" font-size="12" fill="#57606a">MEMORY.md · daily logs</text>
  <text x="430" y="300" text-anchor="middle" font-size="12" fill="#57606a">people · dreams</text>
  <text x="430" y="317" text-anchor="middle" font-size="12" fill="#57606a">alignment synthesis</text>

  <rect x="580" y="236" width="220" height="96" rx="12" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="690" y="263" text-anchor="middle" font-size="14" font-weight="600" fill="#24292f">capabilities</text>
  <text x="690" y="283" text-anchor="middle" font-size="12" fill="#57606a">skills · toolbox</text>
  <text x="690" y="300" text-anchor="middle" font-size="12" fill="#57606a">browser · connectors</text>
  <text x="690" y="317" text-anchor="middle" font-size="12" fill="#57606a">subagents</text>

  <!-- workers -->
  <rect x="300" y="372" width="260" height="88" rx="12" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/>
  <text x="430" y="399" text-anchor="middle" font-size="14" font-weight="600" fill="#24292f">background workers</text>
  <text x="430" y="419" text-anchor="middle" font-size="12" fill="#57606a">wake → read → act → write → report → sleep</text>
  <text x="430" y="436" text-anchor="middle" font-size="12" fill="#57606a">between wake-ups: not thinking</text>

  <!-- arrows -->
  <line x1="430" y1="84" x2="430" y2="120" stroke="#57606a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="360" y1="196" x2="200" y2="232" stroke="#57606a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="430" y1="196" x2="430" y2="232" stroke="#57606a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="500" y1="196" x2="660" y2="232" stroke="#57606a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="170" y1="332" x2="360" y2="372" stroke="#57606a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="430" y1="332" x2="430" y2="368" stroke="#57606a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="690" y1="332" x2="500" y2="372" stroke="#57606a" stroke-width="2" marker-end="url(#arr)"/>

  <text x="430" y="500" text-anchor="middle" font-size="12" fill="#57606a">continuity is bookkeeping: files in, files out, on a schedule</text>
</svg>
